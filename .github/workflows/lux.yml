---
name: Lux

on:
  push:
    branches: ["main"]
    paths:
      - "lux.toml"
      - "lux.lock"
      - ".github/workflows/lux.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lux.toml"
      - "lux.lock"
      - ".github/workflows/lux.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.46.0

      - name: Build dependencies
        run: lx --lua-version 5.1 build --only-deps

      - name: Generate rockspec
        run: |
          lx --lua-version 5.1 generate-rockspec
          ls neotest-java-*.rockspec

      - name: Lint with lux
        run: lx --lua-version 5.1 lint

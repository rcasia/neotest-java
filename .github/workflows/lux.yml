---
name: Lux

on:
  push:
    branches: ["main"]
    paths:
      - "lux.toml"
      - "lux.lock"
      - ".github/workflows/lux.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lux.toml"
      - "lux.lock"
      - ".github/workflows/lux.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.46.0

      - name: Build dependencies
        run: lx --lua-version 5.1 build --only-deps

      - name: Generate rockspec
        run: |
          lx --lua-version 5.1 generate-rockspec
          ls neotest-java-*.rockspec

      # NOTE: `lx lint` (luacheck via lux) is intentionally not run
      # here. It fails on GitHub-hosted ubuntu runners with
      # `lfs.so: undefined symbol: lua_gettop` (lux's luacheck builds
      # luafilesystem against incompatible Lua headers in that
      # environment), while the dedicated `luacheck` job in
      # static-analysis.yml covers the same check and passes.

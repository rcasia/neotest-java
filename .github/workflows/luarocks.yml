---
name: Push to Luarocks

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      LUAROCKS_API_KEY:
        required: true

jobs:
  check_tag:
    runs-on: ubuntu-22.04
    outputs:
      has_tag: ${{ steps.out.outputs.has_tag }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: out
        run: |
          TAGS="$(git tag --points-at HEAD)"
          if [ -z "$TAGS" ]; then
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No tag on HEAD"
          else
            # If multiple tags point to HEAD, pick the first
            TAG="$(echo "$TAGS" | head -n1)"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Tag on HEAD: $TAG"
          fi

  luarocks-upload:
    needs: check_tag
    if: needs.check_tag.outputs.has_tag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.46.0

      - name: Validate project
        run: |
          lx --lua-version 5.1 build
          lx --lua-version 5.1 generate-rockspec

      # NOTE: lux.toml is the single source of truth for the
      # luarocks package (dependencies, build spec, metadata).
      # `lx upload` generates the rockspec from lux.toml, so the
      # dependencies below are informational only — keep them in
      # sync with the [dependencies] table in lux.toml.
      # NOTE: tree-sitter-java is intentionally NOT a dependency.
      # The Java parser is provided by nvim-treesitter (`:TSInstall java`,
      # see README prerequisites and `:checkhealth neotest-java`).
      # Listing it here broke the release workflow because the
      # tree-sitter-java rock needs the `treesitter-parser` build backend
      # (luarocks-build-treesitter-parser), which luarocks 3.13 in the
      # action's nix environment cannot find in the isolated test tree
      # (see Release run 35866794049).
      # Current lux.toml dependencies:
      #   neotest, nvim-nio, nvim-dap, nvim-dap-ui
      - name: Lux Upload
        run: lx upload --sign-protocol none
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}

name: Static Analysis

on:
  push:
    branches: ["main"]
    paths:
      - "lua/**"
      - "*.lua"
      - ".stylua.toml"
      - ".luacheckrc"
      - ".pre-commit-config.yaml"
      - "lux.toml"
      - "lux.lock"
      - ".github/workflows/static-analysis.yml"
      - ".github/workflows/lux.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lua/**"
      - "*.lua"
      - ".stylua.toml"
      - ".luacheckrc"
      - ".pre-commit-config.yaml"
      - "lux.toml"
      - "lux.lock"
      - ".github/workflows/static-analysis.yml"
      - ".github/workflows/lux.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.46.0
      # lux's auto-installed static Lua can't dlopen C modules
      # (`lfs.so: undefined symbol: lua_gettop`), which `lx lint`
      # needs via luacheck → luafilesystem. A distro Lua links
      # liblua dynamically, so luafilesystem loads fine when lux
      # detects and uses the system interpreter instead.
      - name: Install system Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev
      - name: Lint with lux
        run: lx --lua-version 5.1 lint

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.46.0
      - name: Check formatting with lux
        run: |
          lx --lua-version 5.1 fmt
          git diff --exit-code

  lua-language-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache lua-language-server
        uses: actions/cache@v6
        with:
          path: ~/.local/lua-language-server
          key: lua-language-server-3.18.2
      - name: Install lua-language-server
        run: |
          if ! [ -x ~/.local/lua-language-server/bin/lua-language-server ]; then
            mkdir -p ~/.local/lua-language-server
            curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.18.2/lua-language-server-3.18.2-linux-x64.tar.gz | tar -xz -C ~/.local/lua-language-server
          fi
      - name: Run luacheck via lua-language-server
        run: ~/.local/lua-language-server/bin/lua-language-server --check .
